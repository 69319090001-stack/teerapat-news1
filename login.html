<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ – TeerapatNews</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="navbar-container"></div>
  <main class="wrap auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="ChatGPT%20Image%20Aug%206%2C%202026%2C%2010_44_52%20AM.png" alt="TeerapatNews logo" />
        <span class="brand-text"><strong>Teerapat</strong><span>News</span></span>
      </a>
      <h1>เข้าสู่ระบบ</h1>
      <p>ล็อกอินเพื่อเข้าสู่ระบบและจัดการข่าวบน TeerapatNews</p>
      <form id="login-form" class="form-grid">
        <div class="form-group">
          <label for="email">อีเมล</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <input class="input" id="password" type="password" placeholder="••••••" required />
        </div>
        <div class="form-actions">
          <button class="button primary block" type="submit">เข้าสู่ระบบ</button>
          <a class="button secondary block" href="signup.html">สมัครสมาชิก</a>
        </div>
      </form>
      <div id="message" class="message"></div>
      <div class="link-row">
        <a href="index.html">← กลับไปหน้าแรก</a>
      </div>
    </section>
  </main>

  <script src="navbar.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const apiHost = window.location.hostname === '127.0.0.1' ? 'http://localhost:3000' : '';
        const response = await fetch(`${apiHost}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const text = await response.text();
        const result = text ? JSON.parse(text) : { ok: false, message: 'เซิร์ฟเวอร์ตอบกลับว่าง' };
        message.className = 'message ' + (result.ok ? 'success' : 'error');
        message.textContent = result.message;

        if (result.ok) {
          const user = {
            ...result.user,
            role: result.user.role || (email.toLowerCase() === 'admin@teerapatnews.com' ? 'admin' : 'user')
          };
          localStorage.setItem('user', JSON.stringify(user));
          localStorage.setItem('teerapatAuth', JSON.stringify(user));
          const redirectUrl = user.role === 'admin' ? 'admin.html' : 'profile.html';
          setTimeout(() => { window.location.href = redirectUrl; }, 800);
        }
      } catch (error) {
        console.error(error);
        message.className = 'message error';
        message.textContent = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้';
      }
    });
  </script>
</body>
</html>
